<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fuad Premium</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <!-- Status Bar Fake (optional visual) -->
  <div class="status-bar">
    <span class="time">15:39</span>
    <div class="status-icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-three-quarters"></i>
    </div>
  </div>

  <!-- Header Toko -->
  <header class="store-header">
    <div class="store-info">
      <div class="avatar">
        <img src="https://i.pravatar.cc/150?img=47" alt="Yura Store" />
      </div>
      <div class="store-meta">
        <h1>Fuad Premium</h1>
        <p class="owner">oleh Adensayur</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" aria-label="Theme">
        <i class="fas fa-sun"></i>
      </button>
      <button class="icon-btn" aria-label="Cart">
        <i class="fas fa-shopping-bag"></i>
      </button>
    </div>
  </header>

  <!-- Rating -->
  <div class="rating-bar">
    <div class="rating">
      <i class="fas fa-star"></i>
      <span class="score">5,0</span>
      <span class="reviews">· 13 ulasan pembeli</span>
    </div>
    <i class="fas fa-chevron-right"></i>
  </div>

  <!-- Section Produk -->
  <main class="products-section">
    <h2 class="section-title">Produk</h2>

    <div class="products-grid" id="productsGrid">
      <!-- Produk diisi via JS -->
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="toko">
      <i class="fas fa-store"></i>
      <span>Toko</span>
    </button>
    <button class="nav-item" data-page="pesanan">
      <i class="fas fa-shopping-bag"></i>
      <span>Pesanan</span>
    </button>
    <button class="nav-item" data-page="cara">
      <i class="fas fa-question-circle"></i>
      <span>Cara order</span>
    </button>
  </nav>

  <!-- Modal Order -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Order Produk</h3>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-product">
          <img id="modalImg" src="" alt="" />
          <div>
            <p id="modalName"></p>
            <p class="modal-price" id="modalPrice"></p>
          </div>
        </div>
        <div class="form-group">
          <label>Email / WhatsApp</label>
          <input type="text" id="buyerContact" placeholder="Masukkan email atau nomor WA" />
        </div>
        <div class="form-group">
          <label>Catatan (opsional)</label>
          <textarea id="buyerNote" rows="2" placeholder="Contoh: akun gmail saya..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-order-confirm" id="confirmOrder">Konfirmasi Order</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
